name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest

  docker-build:
    needs: pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Python package
        run: |
          python -m build

      - name: Build Docker image
        run: |
          docker build \
            -f docker/Dockerfile.debian \
            -t fortune:${{ github.sha }} .

      - name: Install Snyk CLI
        run: |
          curl --compressed https://downloads.snyk.io/cli/stable/snyk-linux -o snyk
          chmod +x snyk
          sudo mv snyk /usr/local/bin/snyk

      - name: Authenticate with Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk auth "$SNYK_TOKEN"
          snyk --version

      - name: Scan Docker image with Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk container test fortune:${{ github.sha }} \
            --file=docker/Dockerfile.debian \
            --severity-threshold=high || true

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/581058643714/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: github-actions@project-f06f7e25-398a-4a3d-899.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Configure Docker
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Tag Docker image
        run: |
          docker tag \
            fortune:${{ github.sha }} \
            europe-west1-docker.pkg.dev/project-f06f7e25-398a-4a3d-899/fortune/fortune:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push \
            europe-west1-docker.pkg.dev/project-f06f7e25-398a-4a3d-899/fortune/fortune:${{ github.sha }}

  deploy-staging:
    needs: docker-build
    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying fortune to staging..."            
